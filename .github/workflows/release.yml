name: Create Jjuza DB Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0)"
        required: true
        type: string

      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

      target_os:
        description: "Operating system to build for"
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
          - macos

permissions:
  contents: write

jobs:
  prepare:
    name: Compute build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          case "${{ inputs.target_os }}" in
            all)
              matrix='{"include":[
                {"runner":"ubuntu-latest","target":"linux","binary_name":"jjuza-db","artifact_name":"jjuza-db-linux"},
                {"runner":"windows-latest","target":"windows","binary_name":"jjuza-db.exe","artifact_name":"jjuza-db-windows"},
                {"runner":"macos-latest","target":"macos","binary_name":"jjuza-db","artifact_name":"jjuza-db-macos"}
              ]}'
              ;;
            linux)
              matrix='{"include":[{"runner":"ubuntu-latest","target":"linux","binary_name":"jjuza-db","artifact_name":"jjuza-db-linux"}]}'
              ;;
            windows)
              matrix='{"include":[{"runner":"windows-latest","target":"windows","binary_name":"jjuza-db.exe","artifact_name":"jjuza-db-windows"}]}'
              ;;
            macos)
              matrix='{"include":[{"runner":"macos-latest","target":"macos","binary_name":"jjuza-db","artifact_name":"jjuza-db-macos"}]}'
              ;;
          esac
          echo "matrix=$(echo "$matrix" | tr -d '\n' | tr -s ' ')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system ODBC dependencies (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: Install system ODBC dependencies (macOS)
        if: matrix.target == 'macos'
        run: brew install unixodbc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Build executable
        run: |
          pyinstaller \
            --onefile \
            --name jjuza-db \
            --collect-all pyfiglet \
            --hidden-import=pyodbc \
            jjuza_db/main.py
        shell: bash

      - name: Package build output for upload
        run: |
          mkdir -p out
          if [ "${{ matrix.target }}" = "windows" ]; then
            cp dist/${{ matrix.binary_name }} out/jjuza-db.exe
          else
            cp dist/${{ matrix.binary_name }} out/jjuza-db
            chmod +x out/jjuza-db
            tar -czf out/${{ matrix.artifact_name }}.tar.gz -C out jjuza-db
            rm out/jjuza-db
          fi
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: out/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux executable
        if: ${{ inputs.target_os == 'all' || inputs.target_os == 'linux' }}
        uses: actions/download-artifact@v4
        with:
          name: jjuza-db-linux
          path: release

      - name: Download Windows executable
        if: ${{ inputs.target_os == 'all' || inputs.target_os == 'windows' }}
        uses: actions/download-artifact@v4
        with:
          name: jjuza-db-windows
          path: release

      - name: Download macOS executable
        if: ${{ inputs.target_os == 'all' || inputs.target_os == 'macos' }}
        uses: actions/download-artifact@v4
        with:
          name: jjuza-db-macos
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Jjuza DB ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            release/*