[project]
name = "jjuza-db"
version = "0.1.0"
description = "SQL Server test data generator"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "pyodbc>=5.0",
    "faker>=37.0",
    "rich>=14.0",
    "questionary>=2.1",
    "python-dotenv>=1.0",
    "pyfiglet>=1.0.4",
    "pyinstaller==6.22.2",
]
[project.scripts]
jjuza-db = "jjuza_db.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"